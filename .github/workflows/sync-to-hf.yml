name: Sync TruthLens to Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync files to Hugging Face
        if: env.HF_TOKEN != ''
        uses: huggingface/hub-sync@v0.3.0
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Dildak-prog/truthlens-ai
          space_sdk: gradio
          hf_token: ${{ secrets.HF_TOKEN }}
